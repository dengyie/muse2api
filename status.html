<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muse2API · 账号状态与额度看板</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>
<script type="module">
  import '/ui/ThemeToggle.js';
  import '/ui/StatusIndicator.js';
  import '/ui/SpotlightGlareCard.js';
  import '/ui/AnimatedCounter.js';
  import '/ui/ToastStack.js';
  import '/ui/EmptyState.js';
  import '/ui/StreamingProgressBar.js';
</script>
</head>
<body class="min-h-screen bg-[#f5f3ec] dark:bg-[#0d1017] text-zinc-900 dark:text-zinc-100 antialiased transition-colors">

<header class="sticky top-0 z-30 border-b border-zinc-200/80 dark:border-zinc-800/80 bg-[#f5f3ec]/85 dark:bg-[#0d1017]/85 backdrop-blur-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 rounded-xl bg-indigo-600/10 dark:bg-indigo-500/15 border border-indigo-500/20 flex items-center justify-center text-indigo-600 dark:text-indigo-400" id="brandIcon"></div>
      <div>
        <div class="font-bold text-base tracking-tight flex items-center gap-2">
          <span>Muse2API</span>
          <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-zinc-200/70 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300">状态与额度看板</span>
        </div>
        <div class="text-xs text-zinc-500 dark:text-zinc-400" id="lastSync">等待数据同步</div>
      </div>
      <a href="/admin" id="backAdminLink" class="ml-2 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-zinc-300/80 dark:border-zinc-700/80 text-xs font-medium text-zinc-700 dark:text-zinc-300 hover:border-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">
        返回管理台
      </a>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <theme-toggle storage-key="muse-theme"></theme-toggle>
      <input id="apiKey" type="password" placeholder="输入 API Key (m2a_...)" class="w-44 sm:w-52 px-3 py-1.5 rounded-xl bg-white dark:bg-zinc-900 border border-zinc-300/80 dark:border-zinc-700/80 text-xs font-mono focus:outline-none focus:border-indigo-500">
      <button id="btnSaveKey" class="px-3 py-1.5 rounded-xl border border-zinc-300/80 dark:border-zinc-700/80 bg-white dark:bg-zinc-900 text-xs font-medium hover:border-indigo-500 transition-colors">保存 Key</button>
      <button id="btnRefreshAll" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold shadow-sm transition-colors disabled:opacity-50">
        刷新全部额度
      </button>
      <button id="btnKeepalive" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-zinc-300/80 dark:border-zinc-700/80 bg-white dark:bg-zinc-900 text-xs font-medium hover:border-indigo-500 transition-colors disabled:opacity-50">
        一键保活
      </button>
      <label class="inline-flex items-center gap-1.5 text-xs text-zinc-500 dark:text-zinc-400 select-none pl-1">
        <input id="autoRefresh" type="checkbox" checked class="rounded border-zinc-400 text-indigo-600 focus:ring-indigo-500">
        60s 自动刷新
      </label>
    </div>
  </div>
  <div id="batchProgressWrap" class="max-w-7xl mx-auto px-4 sm:px-6 pb-2 hidden">
    <streaming-progress-bar id="batchProgress" value="0" label="正在批量刷新账号额度..." status="streaming"></streaming-progress-bar>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">
  <!-- KPI 概览 -->
  <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <spotlight-glare-card enable-tilt="true" max-tilt="4" glare-opacity="0.35" class="p-4">
      <div class="flex items-center justify-between text-xs text-zinc-500 dark:text-zinc-400">
        <span>健康可用账号</span>
        <span id="kpiIconHealth"></span>
      </div>
      <div class="mt-2 flex items-baseline gap-1.5">
        <animated-counter id="kHealth" target="0" duration="700" class="text-2xl font-bold"></animated-counter>
        <span id="kHealthTotal" class="text-sm font-mono text-zinc-400">/ 0</span>
      </div>
      <div class="mt-1 text-xs text-zinc-500 dark:text-zinc-400" id="kHealthSub">加载中...</div>
    </spotlight-glare-card>

    <spotlight-glare-card enable-tilt="true" max-tilt="4" glare-opacity="0.35" class="p-4">
      <div class="flex items-center justify-between text-xs text-zinc-500 dark:text-zinc-400">
        <span>本周平均已用额度</span>
        <span id="kpiIconQuota"></span>
      </div>
      <div class="mt-2 flex items-baseline gap-1">
        <animated-counter id="kQuota" target="0" suffix="%" duration="700" class="text-2xl font-bold"></animated-counter>
      </div>
      <div class="mt-1 text-xs text-zinc-500 dark:text-zinc-400" id="kQuotaSub">仅统计已探测账号</div>
    </spotlight-glare-card>

    <spotlight-glare-card enable-tilt="true" max-tilt="4" glare-opacity="0.35" class="p-4">
      <div class="flex items-center justify-between text-xs text-zinc-500 dark:text-zinc-400">
        <span>TetherPool 出口池</span>
        <span id="kpiIconTp"></span>
      </div>
      <div class="mt-2">
        <status-indicator id="kTpBadge" status="connecting" label="检测中"></status-indicator>
      </div>
      <div class="mt-2 text-xs text-zinc-500 dark:text-zinc-400" id="kTpSub">-</div>
    </spotlight-glare-card>

    <spotlight-glare-card enable-tilt="true" max-tilt="4" glare-opacity="0.35" class="p-4">
      <div class="flex items-center justify-between text-xs text-zinc-500 dark:text-zinc-400">
        <span>自维护登录态</span>
        <span id="kpiIconAuth"></span>
      </div>
      <div class="mt-2 flex items-baseline gap-1.5">
        <animated-counter id="kAuth" target="0" duration="700" class="text-2xl font-bold"></animated-counter>
        <span id="kAuthTotal" class="text-sm font-mono text-zinc-400">/ 0</span>
      </div>
      <div class="mt-1 text-xs text-zinc-500 dark:text-zinc-400" id="kAuthSub">-</div>
    </spotlight-glare-card>
  </section>

  <!-- 筛选栏 -->
  <section class="flex flex-wrap items-center justify-between gap-3">
    <div class="flex flex-wrap gap-2" id="filterChips">
      <button class="chip px-3 py-1.5 rounded-full text-xs font-medium border transition-colors bg-indigo-600 text-white border-indigo-600" data-filter="all">全部</button>
      <button class="chip px-3 py-1.5 rounded-full text-xs font-medium border transition-colors bg-white dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300" data-filter="healthy">可用</button>
      <button class="chip px-3 py-1.5 rounded-full text-xs font-medium border transition-colors bg-white dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300" data-filter="bad">异常/掉线</button>
      <button class="chip px-3 py-1.5 rounded-full text-xs font-medium border transition-colors bg-white dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300" data-filter="autologin">已配自动登录</button>
      <button class="chip px-3 py-1.5 rounded-full text-xs font-medium border transition-colors bg-white dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300" data-filter="disabled">已禁用</button>
    </div>
  </section>

  <!-- 账号卡片网格 -->
  <section id="grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 pb-12"></section>
</main>

<toast-stack id="toastStack" duration="4000"></toast-stack>

<script type="module">
import uiIcon from '/ui/UiIcon.js';

const KEY_STORE = 'muse2api_key';
let KEY = localStorage.getItem(KEY_STORE) || '';
let accounts = [];
let tpStatus = null;
let curFilter = 'all';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = (msg, type = 'info') => $('toastStack').push(msg, type);

// Inject UiIcon icons (zero emoji/unicode UI icons)
$('brandIcon').innerHTML = uiIcon('sparkles', { size: 20 });
$('backAdminLink').insertAdjacentHTML('afterbegin', uiIcon('arrow-left', { size: 14 }));
$('btnRefreshAll').insertAdjacentHTML('afterbegin', uiIcon('refresh', { size: 14 }));
$('btnKeepalive').insertAdjacentHTML('afterbegin', uiIcon('zap', { size: 14 }));
$('kpiIconHealth').innerHTML = uiIcon('check-circle', { size: 16, className: 'text-emerald-500' });
$('kpiIconQuota').innerHTML = uiIcon('sliders', { size: 16, className: 'text-indigo-500' });
$('kpiIconTp').innerHTML = uiIcon('globe', { size: 16, className: 'text-sky-500' });
$('kpiIconAuth').innerHTML = uiIcon('lock', { size: 16, className: 'text-amber-500' });

function fmtLeft(ts){
  if (!ts) return '未知';
  const diff = ts - Math.floor(Date.now() / 1000);
  if (diff <= 0) return '已过期';
  const d = Math.floor(diff / 86400);
  const h = Math.floor((diff % 86400) / 3600);
  return d > 0 ? `${d}天 ${h}小时` : `${h}小时`;
}

function ago(ts){
  if (!ts) return '从未';
  const diff = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (diff < 60) return `${diff}s 前`;
  if (diff < 3600) return `${Math.floor(diff/60)}m 前`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h 前`;
  return `${Math.floor(diff/86400)}d 前`;
}

async function api(path, opts = {}){
  const headers = {'Content-Type': 'application/json', ...(opts.headers || {})};
  if (KEY) headers['Authorization'] = 'Bearer ' + KEY;
  const r = await fetch(path, {...opts, headers});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || d.error || ('HTTP ' + r.status));
  return d;
}

function setCounter(id, val){
  const el = $(id);
  el.setAttribute('target', String(val));
  el.textContent = String(val) + (el.getAttribute('suffix') || '');
}

function render(){
  const now = Math.floor(Date.now() / 1000);
  const enabled = accounts.filter(a => a.enabled);
  const healthy = enabled.filter(a => a.ok === true);
  const bad = enabled.filter(a => a.ok === false);
  const frozen = enabled.filter(a => a.video_frozen_until && a.video_frozen_until > now);

  setCounter('kHealth', healthy.length);
  $('kHealthTotal').textContent = `/ ${accounts.length}`;
  $('kHealthSub').textContent = `异常 ${bad.length} · 禁用 ${accounts.length - enabled.length} · 熔断 ${frozen.length}`;

  const qKnown = accounts.filter(a => typeof a.quota?.weekly_used_pct === 'number');
  const avgUsed = qKnown.length ? Math.round(qKnown.reduce((s,a) => s + a.quota.weekly_used_pct, 0) / qKnown.length) : 0;
  const avail100 = qKnown.filter(a => a.quota.weekly_used_pct < 100).length;
  setCounter('kQuota', avgUsed);
  $('kQuotaSub').textContent = qKnown.length ? `${avail100}/${qKnown.length} 个有余量（未探 ${accounts.length - qKnown.length}）` : '暂无额度数据';

  if (tpStatus){
    const tpEl = $('kTpBadge');
    tpEl.setAttribute('status', tpStatus.control_plane_alive ? 'online' : (tpStatus.enabled ? 'error' : 'offline'));
    tpEl.setAttribute('label', tpStatus.control_plane_alive ? '控制面在线' : (tpStatus.enabled ? '控制面异常' : '未启用'));
    const binds = Object.keys(tpStatus.bindings || {}).length;
    $('kTpSub').textContent = `活跃绑定 ${binds} 个出口节点`;
  } else {
    $('kTpBadge').setAttribute('status', 'offline');
    $('kTpBadge').setAttribute('label', '未获取');
    $('kTpSub').textContent = '-';
  }

  const withAuth = accounts.filter(a => a.auth_profile);
  const manual = withAuth.filter(a => a.auth_profile?.needs_manual);
  setCounter('kAuth', withAuth.length);
  $('kAuthTotal').textContent = `/ ${accounts.length}`;
  $('kAuthSub').textContent = manual.length ? `${manual.length} 个账号需要人工接管` : '自愈凭据就绪';

  const filtered = accounts.filter(a => {
    if (curFilter === 'healthy') return a.enabled && a.ok === true;
    if (curFilter === 'bad') return a.enabled && a.ok === false;
    if (curFilter === 'autologin') return !!a.auth_profile;
    if (curFilter === 'disabled') return !a.enabled;
    return true;
  });

  if (!filtered.length){
    $('grid').innerHTML = `<div class="col-span-full rounded-2xl border border-dashed border-zinc-300 dark:border-zinc-800 bg-white/50 dark:bg-zinc-900/40"><empty-state icon="user" title="当前筛选条件下暂无账号" description="请切换筛选条件或前往管理台添加账号"></empty-state></div>`;
    return;
  }

  $('grid').innerHTML = filtered.map(a => {
    const q = a.quota || {};
    const pct = typeof q.weekly_used_pct === 'number' ? q.weekly_used_pct : null;
    const barStatus = pct === null ? 'streaming' : pct >= 90 ? 'error' : 'done';
    const isFrozen = a.video_frozen_until && a.video_frozen_until > now;
    const ap = a.auth_profile;

    const stKind = !a.enabled ? 'offline' : a.ok === true ? 'online' : a.ok === false ? 'error' : 'busy';
    const stLabel = !a.enabled ? '已禁用' : a.ok === true ? '可用' : a.ok === false ? '异常' : '未检测';

    const authBadge = !ap
      ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-zinc-100 dark:bg-zinc-800 text-zinc-500">无凭据</span>`
      : ap.needs_manual
      ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-400 border border-amber-200 dark:border-amber-800/60" title="${esc(ap.last_relogin_error)}">${uiIcon('alert-triangle', {size:12})} 需人工</span>`
      : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-sky-50 dark:bg-sky-950/40 text-sky-700 dark:text-sky-400 border border-sky-200 dark:border-sky-800/60">${uiIcon(ap.auth_type === 'email_otp' ? 'sparkles' : 'lock', {size:12})} ${ap.auth_type === 'email_otp' ? '邮箱 OTP' : '密码'}</span>`;

    const nodeText = a.binding?.node_id ? `${a.binding.node_id} (${a.binding.region || '-'})` : (a.proxy?.server || '默认网络');

    return `<spotlight-glare-card glare-opacity="0.22" class="p-4 flex flex-col gap-3">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <div class="font-bold text-sm truncate">${esc(a.label)}</div>
          <div class="font-mono text-[11px] text-zinc-500 dark:text-zinc-400 mt-0.5">${esc(a.id)} · ${a.cookie_count} cookies</div>
        </div>
        <div class="flex flex-wrap items-center justify-end gap-1.5 shrink-0">
          <status-indicator status="${stKind}" label="${stLabel}" ${a.ok !== true ? 'show-dot="false"' : ''}></status-indicator>
          ${isFrozen ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300">熔断</span>` : ''}
          ${authBadge}
        </div>
      </div>

      <div class="rounded-xl bg-zinc-100/80 dark:bg-zinc-900/80 border border-zinc-200/70 dark:border-zinc-800/80 p-3 space-y-2">
        <streaming-progress-bar
          value="${pct === null ? 0 : pct}"
          label="本周额度 · ${esc(q.plan || '未知计划')}${q.weekly_reset ? ' · 重置 ' + esc(q.weekly_reset) : ''}"
          status="${barStatus}">
        </streaming-progress-bar>
        <div class="flex items-center justify-between text-[11px] text-zinc-500 dark:text-zinc-400">
          <span>额外额度：${esc(q.extra_left || '-')}</span>
          <span>查询：${ago(q.checked_at)}</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="rounded-lg bg-zinc-100/60 dark:bg-zinc-900/60 border border-zinc-200/60 dark:border-zinc-800/60 px-2.5 py-1.5 overflow-hidden">
          <div class="text-[10px] text-zinc-500 dark:text-zinc-400">会话有效期</div>
          <div class="font-mono truncate mt-0.5">${fmtLeft(a.expires_at)}${a.expires_estimated ? ' (估)' : ''}</div>
        </div>
        <div class="rounded-lg bg-zinc-100/60 dark:bg-zinc-900/60 border border-zinc-200/60 dark:border-zinc-800/60 px-2.5 py-1.5 overflow-hidden">
          <div class="text-[10px] text-zinc-500 dark:text-zinc-400">出口绑定</div>
          <div class="font-mono truncate mt-0.5" title="${esc(nodeText)}">${esc(nodeText)}</div>
        </div>
        <div class="rounded-lg bg-zinc-100/60 dark:bg-zinc-900/60 border border-zinc-200/60 dark:border-zinc-800/60 px-2.5 py-1.5 overflow-hidden">
          <div class="text-[10px] text-zinc-500 dark:text-zinc-400">调用 / 最近</div>
          <div class="font-mono truncate mt-0.5">${a.use_count || 0} 次 · ${ago(a.last_used)}</div>
        </div>
        <div class="rounded-lg bg-zinc-100/60 dark:bg-zinc-900/60 border border-zinc-200/60 dark:border-zinc-800/60 px-2.5 py-1.5 overflow-hidden">
          <div class="text-[10px] text-zinc-500 dark:text-zinc-400">自动重登账号</div>
          <div class="font-mono truncate mt-0.5">${esc(ap?.identifier_masked || '未绑定')}</div>
        </div>
      </div>

      <div class="text-xs text-zinc-500 dark:text-zinc-400 rounded-lg border border-dashed border-zinc-200 dark:border-zinc-800 px-2.5 py-1.5 break-words">${esc(a.note || '暂无备注')}</div>

      <div class="flex flex-wrap gap-1.5 pt-1 mt-auto">
        <button data-card-act="quota" data-id="${a.id}" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border border-zinc-300/80 dark:border-zinc-700/80 text-xs hover:border-indigo-500 transition-colors">${uiIcon('refresh', {size:12})} 刷新额度</button>
        <button data-card-act="test" data-id="${a.id}" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border border-zinc-300/80 dark:border-zinc-700/80 text-xs hover:border-indigo-500 transition-colors">${uiIcon('check', {size:12})} 测试</button>
        <button data-card-act="keepalive" data-id="${a.id}" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border border-zinc-300/80 dark:border-zinc-700/80 text-xs hover:border-indigo-500 transition-colors">${uiIcon('zap', {size:12})} 保活</button>
        ${ap ? `<button data-card-act="autologin" data-id="${a.id}" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border border-indigo-500/40 bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 text-xs hover:bg-indigo-500/20 transition-colors">${uiIcon('lock', {size:12})} 自动登录</button>` : ''}
      </div>
    </spotlight-glare-card>`;
  }).join('');
}

async function loadData(){
  if (!KEY){
    $('grid').innerHTML = `<div class="col-span-full rounded-2xl border border-dashed border-zinc-300 dark:border-zinc-800 bg-white/50 dark:bg-zinc-900/40"><empty-state icon="lock" title="请输入 API Key 查看账号状态与额度" description="在右上角填入 m2a_ 开头的管理密钥并点击保存"></empty-state></div>`;
    return;
  }
  try{
    const [accRes, tpRes] = await Promise.all([
      api('/admin/accounts'),
      api('/admin/tetherpool/status').catch(() => null),
    ]);
    accounts = accRes.accounts || [];
    tpStatus = tpRes;
    render();
    $('lastSync').textContent = '最近同步：' + new Date().toLocaleTimeString();
  }catch(e){
    $('grid').innerHTML = `<div class="col-span-full rounded-2xl border border-dashed border-rose-300 dark:border-rose-800/60 bg-rose-50/30 dark:bg-rose-950/20"><empty-state icon="alert-triangle" title="加载失败：${esc(e.message)}" description="请确认右上角已保存有效的 API Key"></empty-state></div>`;
  }
}

$('btnSaveKey').addEventListener('click', () => {
  const v = $('apiKey').value.trim();
  if (!v) return toast('请输入 API Key', 'warning');
  KEY = v;
  localStorage.setItem(KEY_STORE, v);
  toast('API Key 已保存', 'success');
  loadData();
});

$('btnRefreshAll').addEventListener('click', async () => {
  const targets = accounts.filter(a => a.enabled && a.cookie_count > 0);
  if (!targets.length) return toast('没有可查询额度的账号', 'warning');
  const btn = $('btnRefreshAll');
  const wrap = $('batchProgressWrap');
  const bar = $('batchProgress');
  btn.disabled = true;
  wrap.classList.remove('hidden');
  let ok = 0;
  for (let i = 0; i < targets.length; i++){
    bar.setAttribute('value', String(Math.round(((i) / targets.length) * 100)));
    bar.setAttribute('label', `正在查询 ${targets[i].label || targets[i].id} (${i + 1}/${targets.length})`);
    bar.setAttribute('status', 'streaming');
    try{
      await api(`/admin/accounts/${targets[i].id}/quota`, {method:'POST'});
      ok++;
    }catch(_){}
  }
  bar.setAttribute('value', '100');
  bar.setAttribute('status', ok === targets.length ? 'done' : 'error');
  bar.setAttribute('label', `刷新完成：${ok}/${targets.length} 成功`);
  btn.disabled = false;
  toast(`已刷新 ${ok}/${targets.length} 个账号额度`, ok === targets.length ? 'success' : 'warning');
  loadData();
  setTimeout(() => wrap.classList.add('hidden'), 3000);
});

$('btnKeepalive').addEventListener('click', async () => {
  const btn = $('btnKeepalive');
  btn.disabled = true;
  try{
    const r = await api('/admin/accounts/keepalive?force=true', {method:'POST'});
    toast(r.status === 'busy' ? '保活任务运行中' : `保活完成：刷新 ${r.refreshed_count || 0} 个账号`, 'success');
    loadData();
  }catch(e){ toast('保活失败：' + e.message, 'error'); }
  finally{ btn.disabled = false; }
});

$('grid').addEventListener('click', async ev => {
  const btn = ev.target.closest('[data-card-act]');
  if (!btn) return;
  const act = btn.dataset.cardAct;
  const id = btn.dataset.id;
  btn.disabled = true;
  try{
    if (act === 'quota'){
      const q = await api(`/admin/accounts/${id}/quota`, {method:'POST'});
      toast(`额度已更新：${q.weekly_used_pct ?? '?'}%`, 'success');
    } else if (act === 'test'){
      const r = await api(`/admin/accounts/${id}/test`, {method:'POST'});
      toast(r.message || '测试完成', r.ok ? 'success' : 'warning');
    } else if (act === 'keepalive'){
      const r = await api(`/admin/accounts/${id}/keepalive`, {method:'POST'});
      toast(r.ok ? '保活成功' : '保活失败：' + (r.error || ''), r.ok ? 'success' : 'error');
    } else if (act === 'autologin'){
      toast('正在启动隔离浏览器自动登录...', 'info');
      const r = await api(`/admin/accounts/${id}/auto-login`, {method:'POST'});
      toast(r.ok ? `自动登录成功 (${r.cookie_count} cookies)` : '失败：' + (r.error || ''), r.ok ? 'success' : 'error');
    }
    loadData();
  }catch(e){ toast('操作失败：' + e.message, 'error'); }
  finally{ btn.disabled = false; }
});

$('filterChips').addEventListener('click', ev => {
  const btn = ev.target.closest('[data-filter]');
  if (!btn) return;
  curFilter = btn.dataset.filter;
  document.querySelectorAll('#filterChips .chip').forEach(c => {
    const active = c === btn;
    c.className = active
      ? 'chip px-3 py-1.5 rounded-full text-xs font-medium border transition-colors bg-indigo-600 text-white border-indigo-600'
      : 'chip px-3 py-1.5 rounded-full text-xs font-medium border transition-colors bg-white dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300';
  });
  render();
});

if (KEY) $('apiKey').value = KEY;
loadData();
setInterval(() => { if ($('autoRefresh').checked && KEY) loadData(); }, 60000);
</script>
</body>
</html>
