<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muse2API · 账号状态与额度看板</title>
<style>
  :root{
    --bg:#0b0f17;--card:#121826;--card2:#171f30;--line:#232e45;
    --fg:#e6edf7;--muted:#8b9bb4;--acc:#5b8cff;--ok:#22c55e;
    --warn:#f59e0b;--bad:#ef4444;--info:#38bdf8;
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:20;background:rgba(11,15,23,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .wrap{max-width:1280px;margin:0 auto;padding:14px 20px}
  .topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
  .brand a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;padding:4px 10px;border:1px solid var(--line);border-radius:8px}
  .brand a:hover{color:var(--fg);border-color:var(--acc)}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  input,select,button{font:inherit;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
  input:focus,select:focus{outline:none;border-color:var(--acc)}
  button{cursor:pointer;transition:.15s}
  button:hover:not(:disabled){border-color:var(--acc);background:#1c263b}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){background:#4a7cf0}
  button.mini{padding:4px 9px;font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .lbl{color:var(--muted);font-size:12px}
  .kpi .val{font-size:24px;font-weight:700;margin:4px 0 2px}
  .kpi .sub{color:var(--muted);font-size:12px}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:5px 11px;border-radius:999px;font-size:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .chip.active{background:rgba(91,140,255,.15);border-color:var(--acc);color:var(--fg)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:14px;margin-bottom:28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .card.bad{border-color:rgba(239,68,68,.45)}
  .card.warn{border-color:rgba(245,158,11,.45)}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .acc-name{font-weight:700;font-size:15px}
  .acc-id{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .badges{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid transparent}
  .badge.ok{background:rgba(34,197,94,.14);color:#4ade80;border-color:rgba(34,197,94,.3)}
  .badge.bad{background:rgba(239,68,68,.14);color:#f87171;border-color:rgba(239,68,68,.3)}
  .badge.warn{background:rgba(245,158,11,.14);color:#fbbf24;border-color:rgba(245,158,11,.3)}
  .badge.info{background:rgba(56,189,248,.14);color:#38bdf8;border-color:rgba(56,189,248,.3)}
  .badge.mute{background:rgba(139,155,180,.12);color:var(--muted);border-color:rgba(139,155,180,.25)}
  .bar-wrap{background:var(--card2);border-radius:8px;padding:10px 12px;border:1px solid var(--line)}
  .bar-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
  .track{height:8px;background:#0b0f17;border-radius:999px;overflow:hidden}
  .fill{height:100%;border-radius:999px;transition:width .3s}
  .fill.ok{background:var(--ok)}
  .fill.warn{background:var(--warn)}
  .fill.bad{background:var(--bad)}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
  .meta-item{background:var(--card2);padding:7px 10px;border-radius:8px;border:1px solid var(--line);overflow:hidden}
  .meta-item .k{color:var(--muted);font-size:11px}
  .meta-item .v{font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .note{font-size:12px;color:var(--muted);background:rgba(255,255,255,.02);padding:7px 10px;border-radius:8px;border:1px dashed var(--line);word-break:break-word}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .empty{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px}
  #toast{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;flex-direction:column;gap:8px}
  .t{background:var(--card2);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .t.ok{border-color:var(--ok)} .t.bad{border-color:var(--bad)} .t.warn{border-color:var(--warn)}
</style>
</head>
<body>
<header>
  <div class="wrap topbar">
    <div class="brand">
      <span>📊 Muse2API 账号状态与额度看板</span>
      <a href="/admin">← 返回管理台</a>
    </div>
    <div class="controls">
      <input id="apiKey" type="password" placeholder="输入 API Key (m2a_...)" style="width:210px">
      <button onclick="saveKey()">保存 Key</button>
      <button class="primary" id="btnRefreshAll" onclick="refreshAllQuotas()">🔄 刷新全部额度</button>
      <button id="btnKeepalive" onclick="runKeepalive()">⚡ 一键保活</button>
      <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)">
        <input id="autoRefresh" type="checkbox" checked> 60s 自动刷新
      </label>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="kpis">
    <div class="kpi"><div class="lbl">账号池健康</div><div class="val" id="kHealth">—</div><div class="sub" id="kHealthSub">加载中…</div></div>
    <div class="kpi"><div class="lbl">本周平均已用额度</div><div class="val" id="kQuota">—</div><div class="sub" id="kQuotaSub">仅统计已探测账号</div></div>
    <div class="kpi"><div class="lbl">TetherPool 出口池</div><div class="val" id="kTp">—</div><div class="sub" id="kTpSub">—</div></div>
    <div class="kpi"><div class="lbl">自维护登录态</div><div class="val" id="kAuth">—</div><div class="sub" id="kAuthSub">—</div></div>
  </section>

  <div class="toolbar">
    <div class="chips" id="filterChips">
      <button class="chip active" data-filter="all">全部</button>
      <button class="chip" data-filter="healthy">可用</button>
      <button class="chip" data-filter="bad">异常/掉线</button>
      <button class="chip" data-filter="autologin">已配自动登录</button>
      <button class="chip" data-filter="disabled">已禁用</button>
    </div>
    <div style="font-size:12px;color:var(--muted)" id="lastSync">尚未刷新</div>
  </div>

  <section class="grid" id="grid">
    <div class="empty">正在加载账号状态与额度…</div>
  </section>
</main>

<div id="toast"></div>

<script>
const KEY_STORE = 'muse2api_key';
let KEY = localStorage.getItem(KEY_STORE) || '';
let accounts = [];
let tpStatus = null;
let curFilter = 'all';

const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, cls=''){
  const el = document.createElement('div');
  el.className = 't ' + cls;
  el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

function saveKey(){
  const v = $('apiKey').value.trim();
  if (!v) return toast('请输入 API Key', 'warn');
  KEY = v;
  localStorage.setItem(KEY_STORE, v);
  toast('API Key 已保存', 'ok');
  loadData();
}

async function api(path, opts={}){
  const headers = {'Content-Type': 'application/json', ...(opts.headers || {})};
  if (KEY) headers['Authorization'] = 'Bearer ' + KEY;
  const r = await fetch(path, {...opts, headers});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || d.error || ('HTTP ' + r.status));
  return d;
}

function fmtLeft(ts){
  if (!ts) return '未知';
  const diff = ts - Math.floor(Date.now() / 1000);
  if (diff <= 0) return '已过期';
  const d = Math.floor(diff / 86400);
  const h = Math.floor((diff % 86400) / 3600);
  return d > 0 ? `${d}天 ${h}小时` : `${h}小时`;
}

function ago(ts){
  if (!ts) return '从未';
  const diff = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (diff < 60) return `${diff}s 前`;
  if (diff < 3600) return `${Math.floor(diff/60)}m 前`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h 前`;
  return `${Math.floor(diff/86400)}d 前`;
}

async function loadData(){
  try{
    const [accRes, tpRes] = await Promise.all([
      api('/admin/accounts'),
      api('/admin/tetherpool/status').catch(() => null),
    ]);
    accounts = accRes.accounts || [];
    tpStatus = tpRes;
    render();
    $('lastSync').textContent = '最近同步：' + new Date().toLocaleTimeString();
  }catch(e){
    $('grid').innerHTML = `<div class="empty">加载失败：${esc(e.message)}（请确认右上角已保存有效 API Key）</div>`;
  }
}

function render(){
  const now = Math.floor(Date.now() / 1000);
  const enabled = accounts.filter(a => a.enabled);
  const healthy = enabled.filter(a => a.ok === true);
  const bad = enabled.filter(a => a.ok === false);
  const frozen = enabled.filter(a => a.video_frozen_until && a.video_frozen_until > now);

  $('kHealth').textContent = `${healthy.length} / ${accounts.length}`;
  $('kHealthSub').textContent = `异常 ${bad.length} · 禁用 ${accounts.length - enabled.length} · 熔断 ${frozen.length}`;

  const qKnown = accounts.filter(a => typeof a.quota?.weekly_used_pct === 'number');
  const avgUsed = qKnown.length ? Math.round(qKnown.reduce((s,a) => s + a.quota.weekly_used_pct, 0) / qKnown.length) : null;
  const avail100 = qKnown.filter(a => a.quota.weekly_used_pct < 100).length;
  $('kQuota').textContent = avgUsed === null ? '—' : `${avgUsed}%`;
  $('kQuotaSub').textContent = `${avail100}/${qKnown.length} 个有余量（未探 ${accounts.length - qKnown.length}）`;

  if (tpStatus){
    $('kTp').textContent = tpStatus.control_plane_alive ? '在线' : (tpStatus.enabled ? '异常' : '未启用');
    const binds = Object.keys(tpStatus.bindings || {}).length;
    $('kTpSub').textContent = `活跃绑定 ${binds} 个节点`;
  } else {
    $('kTp').textContent = '—';
    $('kTpSub').textContent = '未获取';
  }

  const withAuth = accounts.filter(a => a.auth_profile);
  const manual = withAuth.filter(a => a.auth_profile?.needs_manual);
  $('kAuth').textContent = `${withAuth.length} / ${accounts.length}`;
  $('kAuthSub').textContent = manual.length ? `⚠️ ${manual.length} 个需人工接管` : '自愈凭据就绪';

  const filtered = accounts.filter(a => {
    if (curFilter === 'healthy') return a.enabled && a.ok === true;
    if (curFilter === 'bad') return a.enabled && a.ok === false;
    if (curFilter === 'autologin') return !!a.auth_profile;
    if (curFilter === 'disabled') return !a.enabled;
    return true;
  });

  if (!filtered.length){
    $('grid').innerHTML = '<div class="empty">当前筛选条件下暂无账号</div>';
    return;
  }

  $('grid').innerHTML = filtered.map(a => {
    const q = a.quota || {};
    const pct = typeof q.weekly_used_pct === 'number' ? q.weekly_used_pct : null;
    const barCls = pct === null ? 'ok' : pct >= 90 ? 'bad' : pct >= 70 ? 'warn' : 'ok';
    const isFrozen = a.video_frozen_until && a.video_frozen_until > now;
    const ap = a.auth_profile;

    const statusBadge = !a.enabled ? '<span class="badge mute">已禁用</span>'
      : a.ok === true ? '<span class="badge ok">● 可用</span>'
      : a.ok === false ? '<span class="badge bad">● 异常</span>'
      : '<span class="badge warn">○ 未检测</span>';
    const freezeBadge = isFrozen ? '<span class="badge warn">视频熔断</span>' : '';
    const authBadge = !ap ? '<span class="badge mute">无自动凭据</span>'
      : ap.needs_manual ? `<span class="badge warn" title="${esc(ap.last_relogin_error)}">⚠️ 需人工</span>`
      : `<span class="badge info">${ap.auth_type === 'email_otp' ? '📧 OTP' : '🔑 密码'}</span>`;

    const cardCls = !a.enabled ? '' : a.ok === false ? 'bad' : isFrozen ? 'warn' : '';
    const nodeText = a.binding?.node_id ? `${a.binding.node_id} (${a.binding.region || '-'})` : (a.proxy?.server || '默认网络');

    return `<article class="card ${cardCls}">
      <div class="card-head">
        <div>
          <div class="acc-name">${esc(a.label)}</div>
          <div class="acc-id">${esc(a.id)} · ${a.cookie_count} cookies</div>
        </div>
        <div class="badges">${statusBadge}${freezeBadge}${authBadge}</div>
      </div>

      <div class="bar-wrap">
        <div class="bar-row">
          <span>本周额度 (${esc(q.plan || '未知计划')})</span>
          <span><b>${pct === null ? '未查询' : pct + '% 已用'}</b>${q.weekly_reset ? ' · 重置 ' + esc(q.weekly_reset) : ''}</span>
        </div>
        <div class="track"><div class="fill ${barCls}" style="width:${pct ?? 0}%"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px">
          <span>额外额度：${esc(q.extra_left || '—')}</span>
          <span>查询：${ago(q.checked_at)}</span>
        </div>
      </div>

      <div class="meta">
        <div class="meta-item"><div class="k">会话有效期</div><div class="v">${fmtLeft(a.expires_at)}${a.expires_estimated ? ' (估)' : ''}</div></div>
        <div class="meta-item"><div class="k">出口绑定</div><div class="v" title="${esc(nodeText)}">${esc(nodeText)}</div></div>
        <div class="meta-item"><div class="k">使用次数 / 最近</div><div class="v">${a.use_count || 0} 次 · ${ago(a.last_used)}</div></div>
        <div class="meta-item"><div class="k">自动重登账号</div><div class="v">${esc(ap?.identifier_masked || '未绑定')}</div></div>
      </div>

      <div class="note">${esc(a.note || '暂无备注')}</div>

      <div class="acts">
        <button class="mini" onclick="actQuota('${a.id}', this)">刷新额度</button>
        <button class="mini" onclick="actTest('${a.id}', this)">测试</button>
        <button class="mini" onclick="actKeepalive('${a.id}', this)">保活</button>
        ${ap ? `<button class="mini" onclick="actAutoLogin('${a.id}', this)">自动登录</button>` : ''}
      </div>
    </article>`;
  }).join('');
}

async function actQuota(id, btn){
  if (btn) btn.disabled = true;
  try{
    const q = await api(`/admin/accounts/${id}/quota`, {method:'POST'});
    toast(`✓ 额度已更新：${q.weekly_used_pct ?? '?'}%`, 'ok');
    loadData();
  }catch(e){ toast('刷新额度失败：' + e.message, 'bad'); }
  finally{ if (btn) btn.disabled = false; }
}

async function actTest(id, btn){
  if (btn) btn.disabled = true;
  try{
    const r = await api(`/admin/accounts/${id}/test`, {method:'POST'});
    toast((r.ok ? '✓ ' : '✗ ') + (r.message || '完成'), r.ok ? 'ok' : 'warn');
    loadData();
  }catch(e){ toast('测试失败：' + e.message, 'bad'); }
  finally{ if (btn) btn.disabled = false; }
}

async function actKeepalive(id, btn){
  if (btn) btn.disabled = true;
  try{
    const r = await api(`/admin/accounts/${id}/keepalive`, {method:'POST'});
    toast(r.ok ? '✓ 保活成功' : '✗ 保活失败：' + (r.error || ''), r.ok ? 'ok' : 'bad');
    loadData();
  }catch(e){ toast('保活失败：' + e.message, 'bad'); }
  finally{ if (btn) btn.disabled = false; }
}

async function actAutoLogin(id, btn){
  if (btn) btn.disabled = true;
  toast('正在启动隔离浏览器自动登录…');
  try{
    const r = await api(`/admin/accounts/${id}/auto-login`, {method:'POST'});
    toast(r.ok ? `✓ 自动登录成功 (${r.cookie_count} cookies)` : '✗ 失败：' + (r.error || ''), r.ok ? 'ok' : 'bad');
    loadData();
  }catch(e){ toast('自动登录失败：' + e.message, 'bad'); }
  finally{ if (btn) btn.disabled = false; }
}

async function refreshAllQuotas(){
  const targets = accounts.filter(a => a.enabled && a.cookie_count > 0);
  if (!targets.length) return toast('没有可查询额度的账号', 'warn');
  const btn = $('btnRefreshAll');
  btn.disabled = true;
  let ok = 0;
  for (let i = 0; i < targets.length; i++){
    btn.textContent = `刷新中 (${i+1}/${targets.length})…`;
    try{
      await api(`/admin/accounts/${targets[i].id}/quota`, {method:'POST'});
      ok++;
    }catch(_){}
  }
  btn.textContent = '🔄 刷新全部额度';
  btn.disabled = false;
  toast(`已刷新 ${ok}/${targets.length} 个账号额度`, ok === targets.length ? 'ok' : 'warn');
  loadData();
}

async function runKeepalive(){
  const btn = $('btnKeepalive');
  btn.disabled = true;
  try{
    const r = await api('/admin/accounts/keepalive?force=true', {method:'POST'});
    toast(r.status === 'busy' ? '保活任务运行中' : `✓ 保活完成：刷新 ${r.refreshed_count || 0} 个`, 'ok');
    loadData();
  }catch(e){ toast('保活失败：' + e.message, 'bad'); }
  finally{ btn.disabled = false; }
}

$('filterChips').addEventListener('click', ev => {
  const btn = ev.target.closest('[data-filter]');
  if (!btn) return;
  curFilter = btn.dataset.filter;
  document.querySelectorAll('#filterChips .chip').forEach(c => c.classList.toggle('active', c === btn));
  render();
});

if (KEY) $('apiKey').value = KEY;
loadData();
setInterval(() => { if ($('autoRefresh').checked && KEY) loadData(); }, 60000);
</script>
</body>
</html>
