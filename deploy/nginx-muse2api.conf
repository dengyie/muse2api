# muse2api mesh 内部接入（不放公网；公网入口仍只有 22 + 48721）
# mesh/内网来源 -> 127.0.0.1:18610
server {
    listen 10.144.144.1:18610;

    client_max_body_size 200m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;

    # patch27b：WebSocket 升级透传（/ws/remote-login 串流通道）——
    # 原 Connection '' 干掉 Upgrade 头，WS 握手 404/400
    location /ws/ {
        proxy_pass http://127.0.0.1:18610;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:18610;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
    }
}
